<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SQM · FMEA 风险画板</title>
  <style>
    :root {
      --bg-canvas: #f5f7fa;
      --surface: #ffffff;
      --ink: #0f172a;
      --ink-2: #334155;
      --ink-3: #64748b;
      --ink-4: #94a3b8;
      --line: #e2e8f0;
      --line-strong: #cbd5e1;
      --accent: #2563eb;
      --accent-soft: #eff6ff;
      --high: #e11d48;
      --high-soft: #fff1f2;
      --med: #d97706;
      --med-soft: #fffbeb;
      --low: #059669;
      --low-soft: #ecfdf5;
      --radius: 10px;
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 8px 24px -4px rgba(15, 23, 42, 0.1), 0 2px 6px -1px rgba(15, 23, 42, 0.05);
      --shadow-lg: 0 20px 44px -8px rgba(15, 23, 42, 0.18), 0 4px 12px -2px rgba(15, 23, 42, 0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: var(--bg-canvas);
      height: 100vh;
      overflow: hidden;
      display: flex;
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    svg.ico {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      stroke-width: 1.8;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    /* ================= 1. 极简左侧系统栏 (默认收起为 52px 图标轨，悬停/点击可展开，绝不抢画布空间) ================= */
    .sys-rail {
      width: 54px;
      background: #0f172a;
      color: #94a3b8;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 0;
      flex-shrink: 0;
      z-index: 40;
      transition: width 0.18s ease;
    }
    .sys-rail.expanded {
      width: 184px;
      align-items: stretch;
      padding: 10px 8px;
    }
    .rail-logo {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      font-weight: 700;
      font-size: 12.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px;
      cursor: pointer;
    }
    .sys-rail.expanded .rail-logo {
      margin: 0 6px 14px;
      width: auto;
      justify-content: flex-start;
      padding: 0 10px;
      gap: 8px;
    }
    .rail-label { display: none; font-size: 12.5px; white-space: nowrap; }
    .sys-rail.expanded .rail-label { display: inline; }

    .rail-item {
      height: 36px;
      width: 36px;
      margin: 2px auto;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      cursor: pointer;
      color: #94a3b8;
      transition: all 0.14s;
    }
    .sys-rail.expanded .rail-item {
      width: 100%;
      justify-content: flex-start;
      padding: 0 10px;
    }
    .rail-item:hover { background: rgba(255, 255, 255, 0.07); color: #f8fafc; }
    .rail-item.active { background: rgba(37, 99, 235, 0.24); color: #fff; font-weight: 600; }
    .rail-foot { margin-top: auto; }

    /* ================= 2. 44px 极简顶栏 (只放高频核心动作，低频全部收进 ⋯) ================= */
    .main-shell {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      position: relative;
      overflow: hidden;
    }

    .topbar {
      height: 44px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 30;
      flex-shrink: 0;
    }
    .tb-group { display: flex; align-items: center; gap: 8px; }

    .crumb-bar {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      color: var(--ink-3);
    }
    .crumb-bar b {
      color: var(--ink);
      font-weight: 600;
    }

    /* 主体左右分栏：左侧可收起模块目录与大纲 + 右侧主视口 */
    .workspace-row {
      flex: 1;
      display: flex;
      min-height: 0;
      overflow: hidden;
      position: relative;
    }

    .module-nav {
      width: 212px;
      background: var(--surface);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      z-index: 22;
      transition: width 0.18s ease;
      overflow: hidden;
    }
    .module-nav.collapsed {
      width: 0;
      border-right: none;
    }
    .mn-sec-head {
      height: 34px;
      padding: 0 10px 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 700;
      color: var(--ink-3);
      letter-spacing: 0.02em;
      border-bottom: 1px solid #f1f5f9;
      flex-shrink: 0;
      white-space: nowrap;
    }
    .mn-scroll-top {
      max-height: 44%;
      overflow-y: auto;
      padding: 6px;
      border-bottom: 1px solid var(--line);
    }
    .mn-scroll-btm {
      flex: 1;
      overflow-y: auto;
      padding: 6px;
    }
    .mn-group-title {
      font-size: 10.5px;
      font-weight: 600;
      color: var(--ink-4);
      padding: 6px 8px 3px;
      white-space: nowrap;
    }
    .mn-row {
      height: 29px;
      padding: 0 8px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      font-size: 12px;
      color: var(--ink-2);
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.12s, color 0.12s;
    }
    .mn-row:hover {
      background: #f1f5f9;
      color: var(--ink);
    }
    .mn-row.active {
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
    }
    .mn-row-left {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      overflow: hidden;
    }
    .mn-row-left span.txt {
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .mn-cnt {
      font-size: 10.5px;
      color: var(--ink-4);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .seg-tabs {
      display: inline-flex;
      background: #f1f5f9;
      padding: 2px;
      border-radius: 7px;
      gap: 2px;
    }
    .seg-tab {
      height: 26px;
      padding: 0 12px;
      border: none;
      border-radius: 5px;
      background: transparent;
      color: var(--ink-3);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.14s;
    }
    .seg-tab.active {
      background: #fff;
      color: var(--ink);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
    }

    .search-box {
      position: relative;
      display: flex;
      align-items: center;
    }
    .search-box svg {
      position: absolute;
      left: 8px;
      color: var(--ink-4);
      width: 13.5px;
      height: 13.5px;
    }
    .search-input {
      height: 28px;
      width: 156px;
      padding: 0 8px 0 26px;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: #f8fafc;
      font-size: 12px;
      color: var(--ink);
      outline: none;
      transition: all 0.15s;
    }
    .search-input:focus {
      width: 196px;
      background: #fff;
      border-color: var(--accent);
    }

    .btn {
      height: 28px;
      padding: 0 10px;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink-2);
      font-size: 12px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      transition: all 0.14s;
      white-space: nowrap;
    }
    .btn:hover { background: #f8fafc; border-color: var(--line-strong); }
    .btn.active-filter {
      background: var(--high-soft);
      border-color: #fda4af;
      color: var(--high);
      font-weight: 600;
    }
    .btn-primary {
      background: var(--ink);
      border-color: var(--ink);
      color: #fff;
      font-weight: 600;
    }
    .btn-primary:hover { background: #1e293b; border-color: #1e293b; }
    .btn-blue {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
    }
    .btn-blue:hover { background: #1d4ed8; }
    .btn-icon { width: 28px; padding: 0; justify-content: center; }

    /* ⋯ 更多下拉菜单 */
    .more-wrap { position: relative; }
    .dropdown-menu {
      position: absolute;
      top: 34px;
      right: 0;
      width: 156px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow-md);
      padding: 4px;
      display: none;
      z-index: 60;
    }
    .dropdown-menu.open { display: block; }
    .dd-item {
      height: 30px;
      padding: 0 9px;
      border-radius: 5px;
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: var(--ink-2);
      cursor: pointer;
    }
    .dd-item:hover { background: #f1f5f9; color: var(--ink); }

    /* ================= 3. 100% 全屏纯净画布 (清空四角，仅留底部短工具坞 + 右下角缩放微标) ================= */
    .stage-canvas {
      flex: 1;
      position: relative;
      overflow: hidden;
      cursor: grab;
      background-color: var(--bg-canvas);
      background-image: radial-gradient(#cbd5e1 1.1px, transparent 1.1px);
      background-size: 20px 20px;
    }
    .stage-canvas.panning { cursor: grabbing; }
    .stage-canvas.pin-cursor { cursor: crosshair; }
    .stage-canvas.drop-ready::after {
      content: '松开鼠标，置入底图';
      position: absolute;
      inset: 20px;
      border: 2px dashed var(--accent);
      border-radius: 12px;
      background: rgba(37, 99, 235, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 600;
      color: var(--accent);
      pointer-events: none;
      z-index: 45;
    }

    .world {
      position: absolute;
      top: 0;
      left: 0;
      width: 3200px;
      height: 2200px;
      transform-origin: 0 0;
    }

    /* SVG 贝塞尔连线 */
    .edges-svg {
      position: absolute;
      inset: 0;
      width: 3200px;
      height: 2200px;
      pointer-events: none;
      z-index: 4;
      overflow: visible;
    }
    .edge-hit {
      fill: none;
      stroke: transparent;
      stroke-width: 16px;
      pointer-events: stroke;
      cursor: pointer;
    }
    .edge-line {
      fill: none;
      stroke-width: 1.8px;
      pointer-events: none;
      transition: stroke-width 0.15s, opacity 0.2s;
    }
    .edge-group.selected .edge-line {
      stroke-width: 2.8px;
    }

    /* 连线极简 2~4 字微标（绝不遮挡节点！） */
    .edge-labels {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 7;
    }
    .edge-tag {
      position: absolute;
      transform: translate(-50%, -50%);
      height: 22px;
      padding: 0 8px;
      border-radius: 99px;
      background: #ffffff;
      border: 1px solid var(--line-strong);
      font-size: 11px;
      font-weight: 600;
      color: var(--ink-2);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.12s, border-color 0.12s, opacity 0.2s;
    }
    .edge-tag:hover {
      transform: translate(-50%, -50%) scale(1.05);
      border-color: var(--accent);
    }
    .edge-tag.selected {
      border-color: var(--accent);
      box-shadow: 0 0 0 2.5px rgba(37, 99, 235, 0.22);
      color: var(--accent);
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
    }
    .dot.HIGH { background: var(--high); }
    .dot.MED { background: var(--med); }
    .dot.LOW { background: var(--low); }

    /* 画布元素 1：图纸底板（极简窄头 + 右下角自由缩放手柄 + 干净圆点图钉） */
    .board-frame {
      position: absolute;
      background: #0f172a;
      border: 1.5px solid #334155;
      border-radius: 10px;
      box-shadow: var(--shadow-md);
      z-index: 2;
      transition: border-color 0.15s, opacity 0.2s;
    }
    .board-frame.selected {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.25), var(--shadow-md);
    }
    .bf-bar {
      height: 28px;
      padding: 0 10px;
      background: #1e293b;
      border-radius: 8.5px 8.5px 0 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #cbd5e1;
      font-size: 11.5px;
      font-weight: 600;
      cursor: move;
    }
    .bf-canvas {
      position: relative;
      width: 100%;
      height: calc(100% - 28px);
      border-radius: 0 0 8.5px 8.5px;
      overflow: hidden;
    }
    .bf-canvas img {
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
      pointer-events: none;
    }

    .resize-grip {
      position: absolute;
      right: -5px;
      bottom: -5px;
      width: 12px;
      height: 12px;
      border-radius: 3px;
      background: #fff;
      border: 2px solid var(--accent);
      cursor: nwse-resize;
      opacity: 0;
      z-index: 12;
      transition: opacity 0.14s;
    }
    .board-frame:hover .resize-grip,
    .board-frame.selected .resize-grip { opacity: 1; }

    /* 图纸上的数字风险图钉（22px 精致圆章，可拖拽微调，悬停可连线） */
    .pin-marker {
      position: absolute;
      transform: translate(-50%, -50%);
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--high);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
      cursor: grab;
      z-index: 6;
      transition: transform 0.12s;
    }
    .pin-marker.MED { background: var(--med); }
    .pin-marker.LOW { background: var(--low); }
    .pin-marker:hover,
    .pin-marker.selected {
      transform: translate(-50%, -50%) scale(1.22);
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.55), 0 4px 10px rgba(0,0,0,0.4);
    }

    /* 画布元素 2：极简部件/工序节点卡（184px 宽，只显「名称 + 短码 + 风险圆点」，零废话！） */
    .node-card {
      position: absolute;
      width: 184px;
      background: var(--surface);
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      padding: 10px 12px;
      box-shadow: var(--shadow-sm);
      cursor: grab;
      z-index: 6;
      transition: box-shadow 0.15s, border-color 0.15s, opacity 0.2s;
    }
    .node-card:hover {
      border-color: #94a3b8;
      box-shadow: var(--shadow-md);
    }
    .node-card.selected {
      border-color: var(--accent);
      box-shadow: 0 0 0 2.5px rgba(37, 99, 235, 0.22), var(--shadow-md);
      z-index: 9;
    }
    .nc-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 3px;
    }
    .nc-name {
      font-size: 13px;
      font-weight: 700;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .nc-code {
      font-size: 11px;
      color: var(--ink-3);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 8px;
    }
    .nc-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 7px;
      border-top: 1px solid #f1f5f9;
      font-size: 11px;
      color: var(--ink-3);
    }
    .nc-risk-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-weight: 600;
    }

    /* 四向连线微锚点 */
    .port {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid var(--accent);
      cursor: crosshair;
      opacity: 0;
      z-index: 11;
      transition: opacity 0.12s, transform 0.12s;
    }
    .node-card:hover .port,
    .board-frame:hover .port,
    .stage-canvas.linking .port { opacity: 1; }
    .port:hover { transform: scale(1.35); background: var(--accent); }
    .port.r { right: -5px; top: 50%; margin-top: -5px; }
    .port.l { left: -5px; top: 50%; margin-top: -5px; }
    .port.t { top: -5px; left: 50%; margin-left: -5px; }
    .port.b { bottom: -5px; left: 50%; margin-left: -5px; }

    .dimmed { opacity: 0.18 !important; }

    /* 底部居中轻盈短工具坞（Figma 范式：纯 SVG 线性图标 + 2 字短词） */
    .bottom-dock {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 4px;
      display: inline-flex;
      align-items: center;
      gap: 2px;
      box-shadow: var(--shadow-md);
      z-index: 20;
    }
    .dock-item {
      height: 30px;
      padding: 0 10px;
      border: none;
      border-radius: 7px;
      background: transparent;
      color: var(--ink-2);
      font-size: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      transition: all 0.12s;
    }
    .dock-item:hover { background: #f1f5f9; color: var(--ink); }
    .dock-item.active { background: var(--ink); color: #fff; }
    .dock-div { width: 1px; height: 16px; background: var(--line); margin: 0 2px; }

    /* 右下角浓缩撤销与缩放胶囊 */
    .corner-zoom {
      position: absolute;
      right: 14px;
      bottom: 16px;
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 3px 5px;
      display: inline-flex;
      align-items: center;
      gap: 2px;
      box-shadow: var(--shadow-sm);
      z-index: 20;
      transition: right 0.2s ease;
    }
    .corner-zoom.shifted { right: 392px; }
    .cz-btn {
      width: 24px;
      height: 24px;
      border: none;
      border-radius: 5px;
      background: transparent;
      color: var(--ink-2);
      font-size: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .cz-btn:hover:not(:disabled) { background: #f1f5f9; }
    .cz-btn:disabled { opacity: 0.32; cursor: default; }
    .cz-val {
      font-size: 11px;
      font-weight: 600;
      color: var(--ink-3);
      min-width: 38px;
      text-align: center;
      cursor: pointer;
    }

    /* ================= 4. 右侧「按需悬浮卡片面板（368px）」(默认完全隐藏，点空白即收！) ================= */
    .floating-panel {
      position: absolute;
      top: 12px;
      right: 12px;
      bottom: 12px;
      width: 368px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      z-index: 25;
      transform: translateX(396px);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.16s ease;
      user-select: text;
    }
    .floating-panel.open {
      transform: translateX(0);
      opacity: 1;
      pointer-events: auto;
    }

    .fp-head {
      padding: 12px 14px 10px;
      border-bottom: 1px solid var(--line);
    }
    .fp-top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .fp-kind {
      font-size: 11px;
      font-weight: 600;
      color: var(--ink-3);
      background: #f1f5f9;
      padding: 2px 7px;
      border-radius: 4px;
    }
    .fp-title-inp {
      width: 100%;
      border: 1px solid transparent;
      border-radius: 5px;
      font-size: 14.5px;
      font-weight: 700;
      color: var(--ink);
      padding: 2px 5px;
      margin-left: -5px;
      outline: none;
      background: transparent;
    }
    .fp-title-inp:hover { background: #f8fafc; }
    .fp-title-inp:focus { background: #fff; border-color: var(--accent); }

    .fp-sub-inp {
      width: 100%;
      border: 1px solid transparent;
      border-radius: 5px;
      font-size: 11.5px;
      color: var(--ink-3);
      padding: 2px 5px;
      margin-left: -5px;
      outline: none;
      background: transparent;
    }
    .fp-sub-inp:hover { background: #f8fafc; }
    .fp-sub-inp:focus { background: #fff; border-color: var(--accent); }

    .fp-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      background: #f8fafc;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* 上图下文 FMEA 卡片（照片清晰无重叠，字段紧凑克制） */
    .fmea-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03);
    }
    .fc-photos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 6px;
      padding: 8px 8px 0;
    }
    .fc-photo-item {
      border-radius: 7px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: #0f172a;
      position: relative;
      cursor: zoom-in;
    }
    .fc-photo-item img {
      width: 100%;
      height: 92px;
      object-fit: cover;
      display: block;
    }
    .fc-photo-badge {
      position: absolute;
      top: 5px;
      left: 5px;
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      color: #fff;
    }
    .fc-photo-badge.NG { background: rgba(225, 29, 72, 0.88); }
    .fc-photo-badge.OK { background: rgba(5, 150, 105, 0.88); }
    .fc-photo-cap {
      background: #fff;
      padding: 3px 6px;
      font-size: 10.5px;
      color: var(--ink-3);
      border-top: 1px solid var(--line);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .fc-main { padding: 10px 12px; }
    .fc-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }
    .fc-mode {
      font-size: 13px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.35;
    }
    .r-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 1px 7px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
    }
    .r-pill.HIGH { background: var(--high-soft); color: var(--high); }
    .r-pill.MED { background: var(--med-soft); color: var(--med); }
    .r-pill.LOW { background: var(--low-soft); color: var(--low); }

    .fc-row {
      font-size: 12px;
      color: var(--ink-2);
      line-height: 1.48;
      margin-bottom: 4px;
    }
    .fc-row span.k {
      color: var(--ink-3);
      font-weight: 600;
      margin-right: 4px;
    }

    /* 短码软标签（只显示 PRT-102 / SUP-008 短码，悬停显示全名，绝不臃肿！） */
    .fc-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #f1f5f9;
      flex-wrap: wrap;
    }
    .short-tags {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
    }
    .s-chip {
      height: 20px;
      padding: 0 6px;
      border-radius: 4px;
      font-size: 10.5px;
      font-weight: 600;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      display: inline-flex;
      align-items: center;
      cursor: pointer;
      background: #f1f5f9;
      color: var(--ink-2);
      border: 1px solid var(--line);
    }
    .s-chip:hover { border-color: var(--accent); color: var(--accent); }
    .s-chip.free {
      font-family: inherit;
      border-style: dashed;
      background: #fff;
      color: var(--ink-3);
    }
    .link-act {
      border: none;
      background: transparent;
      font-size: 11.5px;
      color: var(--ink-3);
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 4px;
    }
    .link-act:hover { background: #f1f5f9; color: var(--ink); }

    /* ================= 5. 视图二：图鉴墙 & 视图三：台账 ================= */
    .sub-view {
      flex: 1;
      overflow-y: auto;
      padding: 18px 22px;
      display: none;
      user-select: text;
    }
    .sub-view.active { display: block; }
    .gal-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 14px;
    }

    .tbl-box {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
    }
    table.std-table { width: 100%; border-collapse: collapse; }
    .std-table th {
      height: 36px;
      padding: 0 12px;
      background: #f8fafc;
      border-bottom: 1px solid var(--line);
      text-align: left;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--ink-3);
    }
    .std-table td {
      height: 40px;
      padding: 6px 12px;
      border-bottom: 1px solid #f1f5f9;
      font-size: 12.5px;
      color: var(--ink-2);
    }
    .std-table tr:hover td { background: #f8fafc; }

    /* ================= 6. 轻量弹窗与灯箱 ================= */
    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.42);
      z-index: 80;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-bg.open { display: flex; }
    .modal-card {
      background: #fff;
      border-radius: 12px;
      width: 560px;
      max-width: 94vw;
      max-height: 86vh;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      user-select: text;
    }
    .mc-head {
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13.5px;
      font-weight: 700;
    }
    .mc-body { padding: 14px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .mc-foot {
      padding: 10px 16px;
      border-top: 1px solid var(--line);
      background: #f8fafc;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    .f-lbl { display: block; font-size: 11.5px; font-weight: 600; color: var(--ink-3); margin-bottom: 4px; }
    .f-inp, .f-sel, .f-txt {
      width: 100%;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      padding: 6px 9px;
      font-size: 12.5px;
      font-family: inherit;
      color: var(--ink);
      outline: none;
    }
    .f-inp:focus, .f-sel:focus, .f-txt:focus { border-color: var(--accent); }

    .pop-mini {
      position: fixed;
      z-index: 90;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 9px;
      box-shadow: var(--shadow-md);
      padding: 10px 12px;
      width: 248px;
      display: none;
      font-size: 12px;
    }
    .pop-mini.open { display: block; }

    .toast-layer {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 120;
      display: flex;
      flex-direction: column;
      gap: 6px;
      pointer-events: none;
    }
    .toast-pill {
      background: var(--ink);
      color: #fff;
      padding: 6px 14px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 500;
      box-shadow: var(--shadow-md);
    }
  </style>
</head>
<body>
  <div class="toast-layer" id="toastLayer"></div>
  <input type="file" id="imgPicker" accept="image/*" style="display:none" />
  <input type="file" id="jsonPicker" accept=".json,application/json" style="display:none" />

  <!-- ================= 1. 极简左侧图标导航轨 ================= -->
  <aside class="sys-rail" id="sysRail">
    <div class="rail-logo" onclick="document.getElementById('sysRail').classList.toggle('expanded')" title="展开/收起系统菜单">
      <span>SQ</span>
      <span class="rail-label">SQM 质量系统</span>
    </div>
    <div class="rail-item" title="供应商清单" onclick="toast('点击卡片短码即可预览关联供应商')">
      <svg class="ico" viewBox="0 0 24 24"><path d="M3 21h18M5 21V7l8-4v18M19 21V11l-6-4"/></svg>
      <span class="rail-label">供应商清单</span>
    </div>
    <div class="rail-item" title="零件清单" onclick="toast('点击卡片短码即可预览关联零件')">
      <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.6.77 1.05 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span class="rail-label">零件清单</span>
    </div>
    <div class="rail-item" title="质量问题清单" onclick="openAiModal()">
      <svg class="ico" viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      <span class="rail-label">质量问题清单</span>
    </div>
    <div class="rail-item active" title="FMEA 风险画板">
      <svg class="ico" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      <span class="rail-label">FMEA 风险画板</span>
    </div>
    <div class="rail-item rail-foot" title="展开/收起导航" onclick="document.getElementById('sysRail').classList.toggle('expanded')">
      <svg class="ico" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
      <span class="rail-label">收起侧栏</span>
    </div>
  </aside>

  <!-- ================= 2. 主壳层（一顶 + 全屏画布 + 一底） ================= -->
  <main class="main-shell">
    <!-- 44px 极简顶栏 -->
    <header class="topbar">
      <div class="tb-group">
        <button class="btn btn-icon" id="btnToggleNav" onclick="toggleModuleNav()" title="收起/展开左侧模块清单">
          <svg class="ico" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
        </button>
        <div class="crumb-bar" id="topCrumb"></div>
      </div>

      <div class="seg-tabs">
        <button class="seg-tab active" id="tabCanvas" onclick="switchView('canvas')">画板</button>
        <button class="seg-tab" id="tabGallery" onclick="switchView('gallery')">图鉴</button>
        <button class="seg-tab" id="tabLedger" onclick="switchView('ledger')">台账</button>
      </div>

      <div class="tb-group">
        <div class="search-box">
          <svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input class="search-input" id="kwInput" placeholder="搜模式 / 编码..." oninput="renderAll()" />
        </div>

        <button class="btn" id="btnHighOnly" onclick="toggleHighFilter()" title="仅高亮高风险项">
          <span class="dot HIGH"></span>高危
        </button>

        <button class="btn btn-primary" onclick="openAiModal()">
          <svg class="ico" viewBox="0 0 24 24"><path d="M12 3l1.9 5.8a2 2 0 0 0 1.3 1.3L21 12l-5.8 1.9a2 2 0 0 0-1.3 1.3L12 21l-1.9-5.8a2 2 0 0 0-1.3-1.3L3 12l5.8-1.9a2 2 0 0 0 1.3-1.3L12 3z"/></svg>
          AI 录入
        </button>

        <div class="more-wrap">
          <button class="btn btn-icon" onclick="toggleMoreMenu(event)" title="更多操作">
            <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/><circle cx="5" cy="12" r="1.5"/></svg>
          </button>
          <div class="dropdown-menu" id="moreMenu">
            <div class="dd-item" onclick="exportJson()">
              <svg class="ico" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              导出备份 JSON
            </div>
            <div class="dd-item" onclick="document.getElementById('jsonPicker').click()">
              <svg class="ico" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              导入备份 JSON
            </div>
            <div class="dd-item" onclick="resetFactory()">
              <svg class="ico" viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
              恢复初始示例
            </div>
          </div>
        </div>
      </div>
    </header>

    <div class="workspace-row">
      <!-- 左侧可收起模块目录与当前画板大纲 (Figma Pages + Layers 范式) -->
      <aside class="module-nav" id="moduleNav">
        <div class="mn-sec-head">
          <span>系统与模块画板</span>
          <div style="display:flex;align-items:center;gap:2px">
            <button class="link-act" onclick="openNewBoardModal()" title="新建模块画板" style="padding:2px 5px;font-weight:700">+</button>
            <button class="link-act" onclick="toggleModuleNav()" title="收起目录">«</button>
          </div>
        </div>
        <div class="mn-scroll-top" id="navBoardTree"></div>

        <div class="mn-sec-head" style="border-top:1px solid #f8fafc">
          <span>当前画板大纲</span>
          <span id="navOutlineCount" style="font-weight:500;color:var(--ink-4)"></span>
        </div>
        <div class="mn-scroll-btm" id="navOutlineList"></div>
      </aside>

      <!-- ================= 视图 1：全屏自由画布 + 按需悬浮右侧卡片 ================= -->
      <div class="stage-canvas" id="stageCanvas">
      <div class="world" id="world">
        <svg class="edges-svg" id="edgesSvg">
          <defs>
            <marker id="arrHigh" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#e11d48" />
            </marker>
            <marker id="arrMed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#d97706" />
            </marker>
            <marker id="arrDef" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#94a3b8" />
            </marker>
          </defs>
        </svg>
        <div class="edge-labels" id="edgeLabels"></div>
        <div id="boardsLayer"></div>
        <div id="nodesLayer"></div>
      </div>

      <!-- 底部轻量化短工具坞（纯 SVG 线性图标 + 2 字短词，零 Emoji） -->
      <div class="bottom-dock">
        <button class="dock-item active" id="toolSelect" onclick="setTool('select')">
          <svg class="ico" viewBox="0 0 24 24"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/></svg>选择
        </button>
        <button class="dock-item" id="toolPin" onclick="setTool('pin')" title="点击底图任意位置添加数字风险点">
          <svg class="ico" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>打点
        </button>
        <div class="dock-div"></div>
        <button class="dock-item" onclick="addBoardImage()" title="上传图纸或直接 Ctrl+V 粘贴剪贴板图片">
          <svg class="ico" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>底图
        </button>
        <button class="dock-item" onclick="addNodeInstant()">
          <svg class="ico" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><line x1="12" y1="9" x2="12" y2="15"/><line x1="9" y1="12" x2="15" y2="12"/></svg>节点
        </button>
        <button class="dock-item" onclick="autoLayout()">
          <svg class="ico" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><path d="M10 6.5h4M17.5 10v4"/></svg>理线
        </button>
      </div>

      <!-- 右下角浓缩撤销与缩放 -->
      <div class="corner-zoom" id="cornerZoom">
        <button class="cz-btn" id="btnUndo" onclick="undo()" title="撤销 Ctrl+Z">
          <svg class="ico" style="width:13px;height:13px" viewBox="0 0 24 24"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
        </button>
        <button class="cz-btn" id="btnRedo" onclick="redo()" title="重做 Ctrl+Y">
          <svg class="ico" style="width:13px;height:13px" viewBox="0 0 24 24"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"/></svg>
        </button>
        <div class="dock-div"></div>
        <button class="cz-btn" onclick="zoomStep(-0.1)">−</button>
        <span class="cz-val" id="zoomVal" onclick="resetView()" title="点击复位 100%">100%</span>
        <button class="cz-btn" onclick="zoomStep(0.1)">+</button>
      </div>

      <!-- 右侧按需悬浮面板（368px，默认完全隐藏，点选对象才浮出，点画布空白即收） -->
      <aside class="floating-panel" id="floatPanel" onmousedown="event.stopPropagation()">
        <div class="fp-head">
          <div class="fp-top-bar">
            <span class="fp-kind" id="fpKind">部件节点</span>
            <div style="display:flex;align-items:center;gap:4px">
              <button class="btn btn-blue" style="height:24px;padding:0 8px;font-size:11.5px" id="fpAddBtn" onclick="openCardModal()">+ 失效卡</button>
              <button class="btn btn-icon" style="height:24px;width:24px;color:var(--ink-3)" onclick="deleteActiveSelection()" title="删除当前对象 (Del)">
                <svg class="ico" style="width:13.5px;height:13.5px" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>
              </button>
              <button class="btn btn-icon" style="height:24px;width:24px;border:none" onclick="clearSelection()" title="收起">
                <svg class="ico" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
              </button>
            </div>
          </div>
          <input class="fp-title-inp" id="fpTitle" onchange="renameSelection(this.value)" title="点击直接改名（连线建议 ≤4 字）" />
          <input class="fp-sub-inp" id="fpSub" placeholder="补充零件短码 / 规格..." onchange="resubSelection(this.value)" />
        </div>
        <div class="fp-body" id="fpBody"></div>
      </aside>
    </div>

    <!-- ================= 视图 2：图鉴墙 ================= -->
    <div class="sub-view" id="stageGallery">
      <div class="gal-grid" id="galGrid"></div>
    </div>

    <!-- ================= 视图 3：同源台账 ================= -->
    <div class="sub-view" id="stageLedger">
      <div class="tbl-box">
        <table class="std-table">
          <thead>
            <tr>
              <th style="width:88px">载体</th>
              <th style="width:140px">部位 / 接口</th>

    // ================= 4. 状态管理、本地持久化与撤销栈 =================
    let db = loadDb();
    let curBoardId = Object.keys(db)[0] || 'actuator';
    let curView = 'canvas';
    let curTool = 'select';
    let highOnly = false;
    let panX = 24, panY = 24, zoom = 1;

    // 默认选中剖面图上的 1 号高危热点，打开页面第一眼即见「剖面图 + 极简节点连线 + 右侧高清照片机理悬浮卡」完整闭环！
    let sel = { kind: 'pin', id: 'pin-1', boardId: 'bp-1' };

    let undoStack = [];
    let redoStack = [];
    let drag = null;
    let popCardTarget = null;
    let editingCardId = null;
    let modalPhotos = [];
    let uploadCb = null;

    function loadDb() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && Object.keys(parsed).length) return parsed;
        }
      } catch (_) {}
      return buildFactoryData();
    }

    function saveDb(recordUndo = true) {
      if (recordUndo) {
        undoStack.push(JSON.stringify(db));
        if (undoStack.length > 30) undoStack.shift();
        redoStack = [];
      }
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); } catch (_) {}
      syncUndoBtns();
    }

    function snapshotBeforeMutate() {
      undoStack.push(JSON.stringify(db));
      if (undoStack.length > 30) undoStack.shift();
      redoStack = [];
      syncUndoBtns();
    }

    function persistOnly() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); } catch (_) {}
    }

    function undo() {
      if (!undoStack.length) return;
      redoStack.push(JSON.stringify(db));
      db = JSON.parse(undoStack.pop());
      if (!db[curBoardId]) curBoardId = Object.keys(db)[0];
      persistOnly();
      syncUndoBtns();
      renderAll();
      toast('已撤销');
    }

    function redo() {
      if (!redoStack.length) return;
      undoStack.push(JSON.stringify(db));
      db = JSON.parse(redoStack.pop());
      persistOnly();
      syncUndoBtns();
      renderAll();
      toast('已重做');
    }

    function syncUndoBtns() {
      document.getElementById('btnUndo').disabled = !undoStack.length;
      document.getElementById('btnRedo').disabled = !redoStack.length;
    }

    function B() { return db[curBoardId]; }

    function maxRisk(fmeas) {
      if (!fmeas || !fmeas.length) return 'LOW';
      if (fmeas.some(f => f.risk === 'HIGH')) return 'HIGH';
      if (fmeas.some(f => f.risk === 'MED')) return 'MED';
      return 'LOW';
    }

    function riskText(r) { return r === 'HIGH' ? '高危' : r === 'MED' ? '中危' : '低危'; }

    // ================= 5. 左侧模块目录与画板大纲 + 核心画布渲染 =================
    function toggleModuleNav() {
      document.getElementById('moduleNav').classList.toggle('collapsed');
    }

    function boardAllFmeas(b) {
      return [
        ...b.boards.flatMap(bp => bp.pins.flatMap(p => p.fmeas)),
        ...b.nodes.flatMap(nd => nd.fmeas),
        ...b.edges.flatMap(ed => ed.fmeas)
      ];
    }

    function renderModuleNav() {
      const cur = B();
      // 1. 顶栏面包屑
      document.getElementById('topCrumb').innerHTML =
        `<span>${esc(cur.group || '未分组系统')}</span> <span>/</span> <b>${esc(cur.name)}</b>`;

      // 2. 上半区：按系统分组的模块画板树
      const groups = {};
      Object.values(db).forEach(b => {
        const g = b.group || '其他模块';
        if (!groups[g]) groups[g] = [];
        groups[g].push(b);
      });

      document.getElementById('navBoardTree').innerHTML = Object.entries(groups).map(([gName, list]) => {
        const rows = list.map(b => {
          const allF = boardAllFmeas(b);
          const r = maxRisk(allF);
          const act = b.id === curBoardId ? 'active' : '';
          return `<div class="mn-row ${act}" onclick="onSwitchBoard('${escAttr(b.id)}')">
            <div class="mn-row-left">
              <svg class="ico" style="width:13px;height:13px;opacity:0.75" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg>
              <span class="txt">${esc(b.name)}</span>
            </div>
            <span class="mn-cnt">${allF.length ? `<span class="dot ${r}"></span>${allF.length}` : ''}</span>
          </div>`;
        }).join('');
        return `<div class="mn-group-title">${esc(gName)}</div>${rows}`;
      }).join('');

      // 3. 下半区：当前画板大纲（底图热点 / 模块节点 / 连线接口，点击平滑定位！）
      const pins = cur.boards.flatMap(bp => bp.pins.map(p => ({ p, bpId: bp.id })));
      const totalItems = pins.length + cur.nodes.length + cur.edges.length;
      document.getElementById('navOutlineCount').textContent = totalItems || '';

      let outHtml = '';
      if (pins.length) {
        outHtml += `<div class="mn-group-title">底图热点</div>` + pins.map(({ p, bpId }) => {
          const isAct = sel && sel.kind === 'pin' && sel.id === p.id ? 'active' : '';
          const r = maxRisk(p.fmeas);
          return `<div class="mn-row ${isAct}" onclick="focusOutlineItem('pin','${p.id}','${bpId}')">
            <div class="mn-row-left"><span style="font-size:10.5px;font-weight:700;color:var(--ink-4)">#${p.num}</span><span class="txt">${esc(p.title)}</span></div>
            <span class="mn-cnt">${p.fmeas.length ? `<span class="dot ${r}"></span>${p.fmeas.length}` : ''}</span>
          </div>`;
        }).join('');
      }
      if (cur.nodes.length) {
        outHtml += `<div class="mn-group-title">模块节点</div>` + cur.nodes.map(nd => {
          const isAct = sel && sel.kind === 'node' && sel.id === nd.id ? 'active' : '';
          const r = maxRisk(nd.fmeas);
          return `<div class="mn-row ${isAct}" onclick="focusOutlineItem('node','${nd.id}')">
            <div class="mn-row-left"><span class="txt">${esc(nd.title)}</span></div>
            <span class="mn-cnt">${nd.fmeas.length ? `<span class="dot ${r}"></span>${nd.fmeas.length}` : ''}</span>
          </div>`;
        }).join('');
      }
      if (cur.edges.length) {
        outHtml += `<div class="mn-group-title">配合与传递接口</div>` + cur.edges.map(ed => {
          const isAct = sel && sel.kind === 'edge' && sel.id === ed.id ? 'active' : '';
          const r = maxRisk(ed.fmeas);
          return `<div class="mn-row ${isAct}" onclick="focusOutlineItem('edge','${ed.id}')">
            <div class="mn-row-left"><span class="txt">${esc(ed.label)}</span></div>
            <span class="mn-cnt">${ed.fmeas.length ? `<span class="dot ${r}"></span>${ed.fmeas.length}` : ''}</span>
          </div>`;
        }).join('');
      }

      document.getElementById('navOutlineList').innerHTML = outHtml || `<div style="padding:12px 8px;font-size:11.5px;color:var(--ink-4)">画板暂无元素</div>`;
    }

    function focusOutlineItem(kind, id, bpId) {
      if (curView !== 'canvas') switchView('canvas');
      let box = null;
      if (kind === 'pin') box = getBox(bpId);
      else if (kind === 'node') box = getBox(id);
      else if (kind === 'edge') {
        const ed = B().edges.find(x => x.id === id);
        if (ed) box = getBox(ed.from);
      }
      if (box) {
        const usableW = Math.max(320, stageEl.clientWidth - 388);
        const usableH = stageEl.clientHeight;
        panX = Math.round(usableW / 2 - (box.x + box.w / 2) * zoom);
        panY = Math.round(usableH / 2 - (box.y + box.h / 2) * zoom);
      }
      selectObj(kind, id, bpId);
    }

    function applyTransform() {
      document.getElementById('world').style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
      document.getElementById('zoomVal').textContent = Math.round(zoom * 100) + '%';
    }

    function getBox(id) {
      const b = B();
      const nd = b.nodes.find(x => x.id === id);
      if (nd) return { x: nd.x, y: nd.y, w: 184, h: 88 };
      const bp = b.boards.find(x => x.id === id);
      if (bp) return { x: bp.x, y: bp.y, w: bp.w, h: bp.h };
      return null;
    }

    function matchesFilter(fmeas, textBlob) {
      const kw = document.getElementById('kwInput').value.trim().toLowerCase();
      if (highOnly && maxRisk(fmeas) !== 'HIGH') return false;
      if (kw && !textBlob.toLowerCase().includes(kw)) return false;
      return true;
    }

    function renderCanvas() {
      applyTransform();
      const b = B();

      // 1. 渲染图纸底板与圆章热点
      document.getElementById('boardsLayer').innerHTML = b.boards.map(bp => {
        const allPinFmeas = bp.pins.flatMap(p => p.fmeas);
        const dim = !matchesFilter(allPinFmeas, JSON.stringify(bp)) && (highOnly || document.getElementById('kwInput').value.trim()) ? 'dimmed' : '';
        const isSel = sel && sel.kind === 'board' && sel.id === bp.id;

        const pinsHtml = bp.pins.map(p => {
          const r = maxRisk(p.fmeas);
          const pSel = sel && sel.kind === 'pin' && sel.id === p.id;
          return `<div class="pin-marker ${r} ${pSel ? 'selected' : ''}"
            style="left:${p.rx * 100}%;top:${p.ry * 100}%"
            title="${escAttr(p.title)}（${p.fmeas.length} 项）"
            onmousedown="startPinDrag(event,'${bp.id}','${p.id}')"
            onclick="event.stopPropagation();selectObj('pin','${p.id}','${bp.id}')">${p.num}</div>`;
        }).join('');

        return `<div class="board-frame ${isSel ? 'selected' : ''} ${dim}" id="dom-${bp.id}"
          style="left:${bp.x}px;top:${bp.y}px;width:${bp.w}px;height:${bp.h}px"
          onclick="event.stopPropagation();onBoardClick(event,'${bp.id}')">
          <div class="bf-bar" onmousedown="startBoxDrag(event,'board','${bp.id}')">
            <span>${esc(bp.title)}</span>
            <span style="font-size:10.5px;color:#94a3b8">${curTool === 'pin' ? '点击画面落点' : bp.pins.length + ' 热点'}</span>
          </div>
          <div class="bf-canvas" id="bfc-${bp.id}">
            <img src="${bp.img}" />
            ${pinsHtml}
          </div>
          <div class="port r" title="拖拽连线" onmousedown="startLink(event,'${bp.id}')"></div>
          <div class="resize-grip" title="拖拽缩放底图" onmousedown="startResize(event,'${bp.id}')"></div>
        </div>`;
      }).join('');

      // 2. 渲染极简部件/工序卡片（仅名称 + 短码 + 风险圆点 + 图片数）
      document.getElementById('nodesLayer').innerHTML = b.nodes.map(nd => {
        const r = maxRisk(nd.fmeas);
        const isSel = sel && sel.kind === 'node' && sel.id === nd.id;
        const dim = !matchesFilter(nd.fmeas, JSON.stringify(nd)) ? 'dimmed' : '';
        const photoCnt = nd.fmeas.reduce((s, f) => s + (f.photos ? f.photos.length : 0), 0);
        const riskSummary = nd.fmeas.length
          ? `<span class="nc-risk-pill"><span class="dot ${r}"></span>${nd.fmeas.length} 项</span>`
          : `<span style="color:var(--ink-4)">待补充</span>`;

        return `<div class="node-card ${isSel ? 'selected' : ''} ${dim}" id="dom-${nd.id}"
          style="left:${nd.x}px;top:${nd.y}px"

          <div class="nc-top">
            <span class="nc-name">${esc(nd.title)}</span>
            ${nd.fmeas.length ? `<span class="dot ${r}"></span>` : ''}
          </div>
          <div class="nc-code">${esc(nd.sub || '未绑短码')}</div>
          <div class="nc-meta">
            ${riskSummary}
            <span>${photoCnt ? photoCnt + ' 图' : ''}</span>
          </div>
          <div class="port l" onmousedown="startLink(event,'${nd.id}')"></div>
          <div class="port r" onmousedown="startLink(event,'${nd.id}')"></div>
          <div class="port t" onmousedown="startLink(event,'${nd.id}')"></div>
          <div class="port b" onmousedown="startLink(event,'${nd.id}')"></div>
        </div>`;
      }).join('');

      renderEdges();
      renderFloatingPanel();
    }

    function calcCurve(a, b) {
      const ax = a.x + a.w / 2, ay = a.y + a.h / 2;
      const bx = b.x + b.w / 2, by = b.y + b.h / 2;
      const dx = bx - ax, dy = by - ay;
      let sx, sy, tx, ty, c1x, c1y, c2x, c2y;
      if (Math.abs(dx) >= Math.abs(dy) * 0.7) {
        sx = dx >= 0 ? a.x + a.w : a.x; sy = ay;
        tx = dx >= 0 ? b.x : b.x + b.w; ty = by;
        const k = Math.max(44, Math.abs(tx - sx) * 0.45);
        c1x = sx + (dx >= 0 ? k : -k); c1y = sy;
        c2x = tx + (dx >= 0 ? -k : k); c2y = ty;
      } else {
        sx = ax; sy = dy >= 0 ? a.y + a.h : a.y;
        tx = bx; ty = dy >= 0 ? b.y : b.y + b.h;
        const k = Math.max(44, Math.abs(ty - sy) * 0.45);
        c1x = sx; c1y = sy + (dy >= 0 ? k : -k);
        c2x = tx; c2y = ty + (dy >= 0 ? -k : k);
      }
      const mx = 0.125 * sx + 0.375 * c1x + 0.375 * c2x + 0.125 * tx;
      const my = 0.125 * sy + 0.375 * c1y + 0.375 * c2y + 0.125 * ty;
      return { d: `M ${sx} ${sy} C ${c1x} ${c1y}, ${c2x} ${c2y}, ${tx} ${ty}`, mx, my };
    }

    function renderEdges(tempPath) {
      const svg = document.getElementById('edgesSvg');
      const lbls = document.getElementById('edgeLabels');
      const defs = svg.querySelector('defs').outerHTML;
      let paths = '', tags = '';

      B().edges.forEach(ed => {
        const ba = getBox(ed.from), bb = getBox(ed.to);
        if (!ba || !bb) return;
        const { d, mx, my } = calcCurve(ba, bb);
        const r = maxRisk(ed.fmeas);
        const hasRisk = ed.fmeas && ed.fmeas.length > 0;
        const isSel = sel && sel.kind === 'edge' && sel.id === ed.id;
        const dim = !matchesFilter(ed.fmeas, JSON.stringify(ed)) ? 'dimmed' : '';

        const stroke = isSel ? '#2563eb' : (!hasRisk ? '#cbd5e1' : r === 'HIGH' ? '#e11d48' : r === 'MED' ? '#d97706' : '#64748b');
        const marker = !hasRisk ? 'url(#arrDef)' : r === 'HIGH' ? 'url(#arrHigh)' : r === 'MED' ? 'url(#arrMed)' : 'url(#arrDef)';

        paths += `<g class="edge-group ${isSel ? 'selected' : ''} ${dim}">
          <path class="edge-hit" d="${d}" onclick="event.stopPropagation();selectObj('edge','${ed.id}')" />
          <path class="edge-line" d="${d}" stroke="${stroke}" ${!hasRisk ? 'stroke-dasharray="4 4"' : ''} marker-end="${marker}" />
        </g>`;

        // 强制最多显示 5 个字，杜绝长标签遮挡！
        const shortText = (ed.label || '接口').slice(0, 5);
        tags += `<div class="edge-tag ${isSel ? 'selected' : ''} ${dim}"
          style="left:${mx}px;top:${my}px"
          title="${escAttr(ed.label)}（点击查看接口 FMEA）"
          onclick="event.stopPropagation();selectObj('edge','${ed.id}')">
          ${hasRisk ? `<span class="dot ${r}"></span>` : ''}${esc(shortText)}
        </div>`;
      });

      if (tempPath) {
        paths += `<path d="${tempPath}" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrDef)" />`;
      }
      svg.innerHTML = defs + paths;
      lbls.innerHTML = tags;
    }

    // ================= 6. 右侧按需悬浮面板（368px）渲染 =================
    function getActiveContext() {
      if (!sel) return null;
      const b = B();
      if (sel.kind === 'node') {
        const nd = b.nodes.find(x => x.id === sel.id);
        return nd ? { kindLabel: '部件 / 工序节点', obj: nd, fmeas: nd.fmeas } : null;
      }
      if (sel.kind === 'edge') {
        const ed = b.edges.find(x => x.id === sel.id);
        return ed ? { kindLabel: '连线接口 FMEA', obj: ed, isEdge: true, fmeas: ed.fmeas } : null;
      }
      if (sel.kind === 'pin') {
        for (const bp of b.boards) {
          const p = bp.pins.find(x => x.id === sel.id);
          if (p) return { kindLabel: `底图热点 #${p.num}`, obj: p, fmeas: p.fmeas };
        }
      }
      if (sel.kind === 'board') {
        const bp = b.boards.find(x => x.id === sel.id);
        if (bp) return { kindLabel: '图纸底板', obj: bp, isBoard: true, fmeas: bp.pins.flatMap(p => p.fmeas) };
      }
      return null;
    }

    function renderCardItemHtml(f, locateMeta) {
      const hasSod = f.s && f.o && f.d;
      const rpnTxt = hasSod ? ` · ${f.s * f.o * f.d}` : '';

        ? `<div class="fc-photos">

              <div class="fc-photo-item" onclick="openLightbox('${p.url}','${escAttr(p.cap || f.mode)}')">
                <span class="fc-photo-badge ${p.tag || 'NG'}">${p.tag || 'NG'}</span>
                <img src="${p.url}" />

              </div>
            `).join('')}
          </div>`

      const chipsHtml = (f.refs || []).map((r, ri) => {
        const shortCode = r.code || (r.label.length > 7 ? r.label.slice(0, 6) + '…' : r.label);
        const fullTip = r.code ? `${r.code} · ${r.label}` : `自由标签：${r.label}`;
        return `<span class="s-chip ${r.type === 'free' ? 'free' : ''}"

      return `<div class="fmea-card">

        <div class="fc-main">
