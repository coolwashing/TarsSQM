            <span class="r-pill ${f.risk}" onclick="openRiskPop(event,'${f.id}')" title="点击调整等级或 S·O·D">
              <span class="dot ${f.risk}"></span>${riskText(f.risk)}${rpnTxt}
            </span>
          </div>
          ${f.mech ? `<div class="fc-row"><span class="k">机理</span>${esc(f.mech)}</div>` : ''}
          ${f.effect ? `<div class="fc-row"><span class="k">后果</span>${esc(f.effect)}</div>` : ''}
          ${f.ctrl ? `<div class="fc-row"><span class="k">防错</span>${esc(f.ctrl)}</div>` : ''}
          <div class="fc-foot">
            <div class="short-tags">${chipsHtml}</div>
            <div style="display:flex;gap:4px;margin-left:auto">
              ${locateMeta
                ? `<button class="link-act" style="color:var(--accent);font-weight:600" onclick="locateOnCanvas('${locateMeta.boardKey}','${locateMeta.kind}','${locateMeta.id}')">定位画板 ↗</button>`
                : `<button class="link-act" onclick="openCardModal('${f.id}')">编辑</button>
                   <button class="link-act" onclick="deleteFmeaCard('${f.id}')">删除</button>`
              }
            </div>
          </div>
        </div>
      </div>`;
    }

    function renderFloatingPanel() {
      const panel = document.getElementById('floatPanel');
      const zoomBox = document.getElementById('cornerZoom');
      const ctx = getActiveContext();

      if (!ctx) {
        panel.classList.remove('open');
        zoomBox.classList.remove('shifted');
        return;
      }

      panel.classList.add('open');
      zoomBox.classList.add('shifted');

      document.getElementById('fpKind').textContent = ctx.kindLabel;
      document.getElementById('fpTitle').value = ctx.isEdge ? ctx.obj.label : ctx.obj.title;
      document.getElementById('fpSub').value = ctx.obj.sub || '';
      document.getElementById('fpSub').style.display = ctx.isBoard ? 'none' : 'block';
      document.getElementById('fpAddBtn').style.display = ctx.isBoard ? 'none' : 'inline-flex';

      const body = document.getElementById('fpBody');
      if (!ctx.fmeas.length) {
        body.innerHTML = `<div style="padding:28px 16px;text-align:center;color:var(--ink-3);font-size:12px;border:1px dashed var(--line-strong);border-radius:9px;background:#fff">
          ${ctx.isBoard
            ? `点击底部 <b>打点</b> 工具，在图纸任意部位落点记录失效`
            : `暂无失效记录，点击右上 <b>+ 失效卡</b> 录入失效照片与机理`
          }
        </div>`;
        return;
      }
      body.innerHTML = ctx.fmeas.map(f => renderCardItemHtml(f, null)).join('');
    }

    // ================= 7. 画布拖拽、缩放底图、挪动图钉、拉线、点空白收起面板 =================
    const stageEl = document.getElementById('stageCanvas');

    stageEl.addEventListener('mousedown', (e) => {
      if (e.target === stageEl || e.target.id === 'world' || e.target.id === 'edgesSvg') {
        drag = { mode: 'pan', sx: e.clientX - panX, sy: e.clientY - panY, moved: false };
        stageEl.classList.add('panning');
      }
    });

    function startBoxDrag(e, kind, id) {
      if (e.button !== 0) return;
      e.stopPropagation();
      const obj = kind === 'node' ? B().nodes.find(x => x.id === id) : B().boards.find(x => x.id === id);
      if (!obj) return;
      snapshotBeforeMutate();
      drag = { mode: 'box', id, obj, mx: e.clientX, my: e.clientY, ox: obj.x, oy: obj.y, moved: false };
    }

    function startResize(e, bpId) {
      e.stopPropagation();
      e.preventDefault();
      const bp = B().boards.find(x => x.id === bpId);
      if (!bp) return;
      snapshotBeforeMutate();
      drag = { mode: 'resize', bp, mx: e.clientX, my: e.clientY, ow: bp.w, oh: bp.h };
    }

    function startPinDrag(e, bpId, pinId) {
      if (e.button !== 0) return;
      e.stopPropagation();
      const bp = B().boards.find(x => x.id === bpId);
      const pin = bp && bp.pins.find(x => x.id === pinId);
      if (!pin) return;
      const canvasRect = document.getElementById('bfc-' + bpId).getBoundingClientRect();
      snapshotBeforeMutate();
      drag = { mode: 'pin', bp, pin, rect: canvasRect, moved: false };
    }

    function startLink(e, fromId) {
      e.stopPropagation();
      e.preventDefault();
      const box = getBox(fromId);
      if (!box) return;
      stageEl.classList.add('linking');
      drag = { mode: 'link', fromId, sx: box.x + box.w / 2, sy: box.y + box.h / 2 };
    }

    window.addEventListener('mousemove', (e) => {
      if (!drag) return;
      if (drag.mode === 'pan') {
        if (Math.hypot(e.clientX - (drag.sx + panX), e.clientY - (drag.sy + panY)) > 3) drag.moved = true;
        panX = e.clientX - drag.sx;
        panY = e.clientY - drag.sy;
        applyTransform();
      } else if (drag.mode === 'box') {
        const dx = (e.clientX - drag.mx) / zoom;
        const dy = (e.clientY - drag.my) / zoom;
        if (Math.hypot(dx, dy) > 2) drag.moved = true;
        drag.obj.x = Math.max(12, Math.round(drag.ox + dx));
        drag.obj.y = Math.max(12, Math.round(drag.oy + dy));
        const dom = document.getElementById('dom-' + drag.id);
        if (dom) { dom.style.left = drag.obj.x + 'px'; dom.style.top = drag.obj.y + 'px'; }
        renderEdges();
      } else if (drag.mode === 'resize') {
        drag.bp.w = Math.max(220, Math.round(drag.ow + (e.clientX - drag.mx) / zoom));
        drag.bp.h = Math.max(150, Math.round(drag.oh + (e.clientY - drag.my) / zoom));
        const dom = document.getElementById('dom-' + drag.bp.id);
        if (dom) { dom.style.width = drag.bp.w + 'px'; dom.style.height = drag.bp.h + 'px'; }
        renderEdges();
      } else if (drag.mode === 'pin') {
        drag.moved = true;
        drag.pin.rx = Math.min(0.95, Math.max(0.05, (e.clientX - drag.rect.left) / drag.rect.width));
        drag.pin.ry = Math.min(0.95, Math.max(0.05, (e.clientY - drag.rect.top) / drag.rect.height));
        renderCanvas();
      } else if (drag.mode === 'link') {
        const r = stageEl.getBoundingClientRect();
        const wx = (e.clientX - r.left - panX) / zoom;
        const wy = (e.clientY - r.top - panY) / zoom;
        const mx = (drag.sx + wx) / 2;
        renderEdges(`M ${drag.sx} ${drag.sy} C ${mx} ${drag.sy}, ${mx} ${wy}, ${wx} ${wy}`);
      }
    });

    window.addEventListener('mouseup', (e) => {
      if (!drag) return;
      if (drag.mode === 'pan' && !drag.moved) {
        // 点击空白画布：自动收起右侧悬浮面板！
        clearSelection();
      } else if ((drag.mode === 'box' || drag.mode === 'pin') && !drag.moved) {
        undoStack.pop();
        syncUndoBtns();
      } else if (drag.mode === 'box' || drag.mode === 'resize' || drag.mode === 'pin') {
        persistOnly();
      } else if (drag.mode === 'link') {
        stageEl.classList.remove('linking');
        const hit = e.target.closest('.node-card, .board-frame');
        if (hit && hit.id) {
          const toId = hit.id.replace('dom-', '');
          if (toId && toId !== drag.fromId) createEdgeInstant(drag.fromId, toId);
        }
        renderEdges();
      }
      stageEl.classList.remove('panning');
      drag = null;
    });

    stageEl.addEventListener('wheel', (e) => {
      e.preventDefault();
      zoomStep(e.deltaY < 0 ? 0.08 : -0.08, e.clientX, e.clientY);
    }, { passive: false });

    function zoomStep(d, cx, cy) {
      const next = Math.min(1.8, Math.max(0.45, +(zoom + d).toFixed(2)));
      if (cx !== undefined) {
        const r = stageEl.getBoundingClientRect();
        const mx = cx - r.left, my = cy - r.top;
        panX = mx - ((mx - panX) / zoom) * next;
        panY = my - ((my - panY) / zoom) * next;
      }
      zoom = next;
      applyTransform();
    }

    function resetView() { panX = 24; panY = 24; zoom = 1; applyTransform(); }

    // 点击对象时，若该对象偏右会被 368px 悬浮卡遮挡，画布自动平滑左移避让！
    function selectObj(kind, id, boardId) {
      closePops();
      sel = { kind, id, boardId };
      const targetId = kind === 'pin' ? boardId : id;
      const box = getBox(targetId);
      if (box) {
        const stageW = stageEl.clientWidth;
        const rightEdgeScreenX = (box.x + box.w) * zoom + panX;
        const safeRight = stageW - 396;
        if (rightEdgeScreenX > safeRight) {
          panX -= (rightEdgeScreenX - safeRight + 24);
        }
      }
      renderCanvas();
      renderModuleNav();
    }

    function clearSelection() {
      closePops();
      sel = null;
      renderCanvas();
      renderModuleNav();
    }

    function setTool(t) {
      curTool = t;
      document.getElementById('toolSelect').classList.toggle('active', t === 'select');
      document.getElementById('toolPin').classList.toggle('active', t === 'pin');
      stageEl.classList.toggle('pin-cursor', t === 'pin');
      renderCanvas();
      if (t === 'pin') toast('点击底图任意部位添加风险点');
    }

    // ================= 8. 零浏览器丑弹窗：原地创建节点、连线、打点、改名、删除 =================
    function onBoardClick(e, bpId) {
      if (curTool !== 'pin') {
        selectObj('board', bpId);
        return;
      }
      const bp = B().boards.find(x => x.id === bpId);
      if (!bp) return;
      const rect = document.getElementById('bfc-' + bpId).getBoundingClientRect();
      const rx = Math.min(0.94, Math.max(0.06, (e.clientX - rect.left) / rect.width));
      const ry = Math.min(0.94, Math.max(0.06, (e.clientY - rect.top) / rect.height));
      snapshotBeforeMutate();
      const num = bp.pins.length + 1;
      const pin = { id: 'pin-' + Date.now(), num, rx, ry, title: `结构热点 #${num}`, sub: '点击修改部位说明', fmeas: [] };
      bp.pins.push(pin);
      persistOnly();
      setTool('select');
      selectObj('pin', pin.id, bp.id);
      openCardModal();
    }

    function addNodeInstant() {
      snapshotBeforeMutate();
      const b = B();
      const idx = b.nodes.length + 1;
      const nd = {
        id: 'nd-' + Date.now(),
        title: `新模块节点 ${idx}`,
        sub: '点击补充零件短码',
        x: Math.round((240 - panX) / zoom + (idx % 3) * 36),
        y: Math.round((140 - panY) / zoom + (idx % 3) * 28),
        fmeas: []
      };
      b.nodes.push(nd);
      persistOnly();
      selectObj('node', nd.id);
      setTimeout(() => {
        const inp = document.getElementById('fpTitle');
        inp.focus();
        inp.select();
      }, 40);
    }

    function createEdgeInstant(fromId, toId) {
      const b = B();
      const dup = b.edges.find(x => (x.from === fromId && x.to === toId) || (x.from === toId && x.to === fromId));
      if (dup) { selectObj('edge', dup.id); return; }
      snapshotBeforeMutate();
      const ed = { id: 'ed-' + Date.now(), from: fromId, to: toId, label: '配合接口', sub: '两模块间作用与传递关系', fmeas: [] };
      b.edges.push(ed);
      persistOnly();
      selectObj('edge', ed.id);
      setTimeout(() => {
        const inp = document.getElementById('fpTitle');
        inp.focus();
        inp.select();
      }, 40);
      toast('已建立连线，可在右侧直接命名或添加接口失效卡');
    }

    function addBoardImage(dataUrl, name) {
      if (!dataUrl) {
        uploadCb = (url, fname) => addBoardImage(url, fname.replace(/\.[^.]+$/, '').slice(0, 12));
        document.getElementById('imgPicker').click();
        return;
      }
      snapshotBeforeMutate();
      const bp = {
        id: 'bp-' + Date.now(),
        title: name || '结构底图',
        x: Math.round((90 - panX) / zoom),
        y: Math.round((90 - panY) / zoom),
        w: 380, h: 260,
        img: dataUrl,
        pins: []
      };
      B().boards.push(bp);
      persistOnly();
      selectObj('board', bp.id);
      toast('已放入底图（右下角可拖拽缩放，点底部「打点」可在图上标风险）');
    }

    function renameSelection(val) {
      const ctx = getActiveContext();
      if (!ctx || !val.trim()) return;
      snapshotBeforeMutate();
      if (ctx.isEdge) ctx.obj.label = val.trim().slice(0, 6);
      else ctx.obj.title = val.trim();
      persistOnly();
      renderAll();
    }

    function resubSelection(val) {
      const ctx = getActiveContext();
      if (!ctx) return;
      snapshotBeforeMutate();
      ctx.obj.sub = val.trim();
      persistOnly();
      renderAll();
    }

    function deleteActiveSelection() {
      if (!sel) return;
      snapshotBeforeMutate();
      const b = B();
      if (sel.kind === 'node') {
        b.nodes = b.nodes.filter(x => x.id !== sel.id);
        b.edges = b.edges.filter(x => x.from !== sel.id && x.to !== sel.id);
      } else if (sel.kind === 'edge') {
        b.edges = b.edges.filter(x => x.id !== sel.id);
      } else if (sel.kind === 'board') {
        b.boards = b.boards.filter(x => x.id !== sel.id);
        b.edges = b.edges.filter(x => x.from !== sel.id && x.to !== sel.id);
      } else if (sel.kind === 'pin') {
        b.boards.forEach(bp => { bp.pins = bp.pins.filter(p => p.id !== sel.id); });
      }
      sel = null;
      persistOnly();
      renderAll();
      toast('已删除（可按 Ctrl+Z 撤销）');
    }

    function autoLayout() {
      snapshotBeforeMutate();
      const b = B();
      b.boards.forEach((bp, i) => { bp.x = 56; bp.y = 84 + i * 320; });
      const sx = b.boards.length ? 590 : 100;
      b.nodes.forEach((nd, i) => {
        nd.x = sx + Math.floor(i / 2) * 310;
        nd.y = 72 + (i % 2) * 190;
      });
      persistOnly();
      resetView();
      renderCanvas();
      toast('已自动整理画板间距');
    }

    // ================= 9. FMEA 卡片编辑、极简风险打分、短码穿透预览 =================
    function findFmea(fid) {
      const b = B();
      for (const nd of b.nodes) { const f = nd.fmeas.find(x => x.id === fid); if (f) return { f, list: nd.fmeas }; }
      for (const ed of b.edges) { const f = ed.fmeas.find(x => x.id === fid); if (f) return { f, list: ed.fmeas }; }
      for (const bp of b.boards) {
        for (const p of bp.pins) { const f = p.fmeas.find(x => x.id === fid); if (f) return { f, list: p.fmeas }; }
      }
      return null;
    }

    function closePops() {
      document.querySelectorAll('.pop-mini').forEach(el => el.classList.remove('open'));
      document.getElementById('moreMenu').classList.remove('open');
    }

    function placePop(el, ev) {
      const r = ev.currentTarget.getBoundingClientRect();
      el.style.top = Math.min(window.innerHeight - 210, r.bottom + 6) + 'px';
      el.style.left = Math.min(window.innerWidth - 265, Math.max(12, r.left - 80)) + 'px';
    }

    function openRiskPop(ev, fid) {
      ev.stopPropagation();
      closePops();
      const hit = findFmea(fid);
      if (!hit) return;
      popCardTarget = hit.f;
      const pop = document.getElementById('riskPop');
      placePop(pop, ev);
      pop.classList.add('open');
      syncRiskPop();
    }

    function syncRiskPop() {
      const f = popCardTarget;
      document.getElementById('rS').value = f.s || 6;
      document.getElementById('rO').value = f.o || 3;
      document.getElementById('rD').value = f.d || 3;
      document.getElementById('vS').textContent = f.s ?? '-';
      document.getElementById('vO').textContent = f.o ?? '-';
      document.getElementById('vD').textContent = f.d ?? '-';
      document.getElementById('rpnHint').textContent = (f.s && f.o && f.d)
        ? `RPN = ${f.s * f.o * f.d}`
        : `当前仅使用手动等级`;
    }

    function setQuickRisk(lv) {
      if (!popCardTarget) return;
      snapshotBeforeMutate();
      popCardTarget.risk = lv;
      persistOnly();
      syncRiskPop();
      renderAll();
    }

    function slideSod() {
      if (!popCardTarget) return;
      const s = +document.getElementById('rS').value;
      const o = +document.getElementById('rO').value;
      const d = +document.getElementById('rD').value;
      popCardTarget.s = s; popCardTarget.o = o; popCardTarget.d = d;
      const rpn = s * o * d;
      popCardTarget.risk = (s >= 9 || rpn >= 100) ? 'HIGH' : (rpn >= 40 ? 'MED' : 'LOW');
      persistOnly();
      syncRiskPop();
      renderAll();
    }

    function clearSod() {
      if (!popCardTarget) return;
      popCardTarget.s = null; popCardTarget.o = null; popCardTarget.d = null;
      persistOnly();
      syncRiskPop();
      renderAll();
    }

    function openRefSnap(ev, fid, idx) {
      closePops();
      const hit = findFmea(fid);
      const ref = hit && hit.f.refs[idx];
      if (!ref) return;
      const pop = document.getElementById('refPop');
      placePop(pop, ev);
      pop.classList.add('open');

      if (ref.code && MASTER_DICT[ref.code]) {
        const m = MASTER_DICT[ref.code];
        document.getElementById('refPopTitle').textContent = `${m.code} · ${m.name}`;
        document.getElementById('refPopBody').innerHTML = `<div>${esc(m.spec)}</div><div style="margin-top:6px;font-size:11px;color:var(--accent)">非硬外键软绑定 · 点击可穿透至原单据</div>`;
      } else {
        document.getElementById('refPopTitle').textContent = '未建档自由标签';
        document.getElementById('refPopBody').innerHTML = `<div>名称：<b>${esc(ref.label)}</b></div><div style="margin-top:4px;font-size:11px;color:var(--ink-3)">早期预研物料无需先建主数据即可挂接保存</div>`;
      }
    }

    function openCardModal(fid) {
      const ctx = getActiveContext();
      if (!ctx || ctx.isBoard) return;
      editingCardId = fid || null;
      const hit = fid ? findFmea(fid) : null;
      const f = hit ? hit.f : null;
      document.getElementById('cmTitle').textContent = f ? '编辑 FMEA 卡片' : `添加失效卡 · ${ctx.isEdge ? ctx.obj.label : ctx.obj.title}`;
      document.getElementById('cmCat').value = f ? f.cat : 'DFMEA';
      document.getElementById('cmRisk').value = f ? f.risk : 'HIGH';
      document.getElementById('cmSod').value = (f && f.s && f.o && f.d) ? `${f.s},${f.o},${f.d}` : '';
      document.getElementById('cmMode').value = f ? f.mode : '';
      document.getElementById('cmMech').value = f ? f.mech : '';
      document.getElementById('cmEffect').value = f ? f.effect : '';
      document.getElementById('cmCtrl').value = f ? f.ctrl : '';
      document.getElementById('cmRefs').value = f ? (f.refs || []).map(r => r.code || r.label).join(', ') : '';
      modalPhotos = f ? JSON.parse(JSON.stringify(f.photos || [])) : [];
      renderModalPhotos();
      document.getElementById('cardModal').classList.add('open');
    }

    function closeCardModal() { document.getElementById('cardModal').classList.remove('open'); }

    function renderModalPhotos() {
      const box = document.getElementById('cmPhotos');
      if (!modalPhotos.length) {
        box.innerHTML = `<span style="font-size:11.5px;color:var(--ink-4)">直接按 Ctrl+V 粘贴截图，或点上方按钮添加</span>`;
        return;
      }
      box.innerHTML = modalPhotos.map((p, i) => `
        <div style="position:relative;width:88px;height:56px;border-radius:6px;overflow:hidden;border:1px solid var(--line-strong)">
          <img src="${p.url}" style="width:100%;height:100%;object-fit:cover" />
          <span onclick="modalPhotos[${i}].tag=modalPhotos[${i}].tag==='NG'?'OK':'NG';renderModalPhotos()" style="position:absolute;top:3px;left:3px;font-size:9.5px;font-weight:700;padding:0 4px;border-radius:3px;color:#fff;cursor:pointer;background:${p.tag === 'OK' ? '#059669' : '#e11d48'}">${p.tag}</span>
          <span onclick="modalPhotos.splice(${i},1);renderModalPhotos()" style="position:absolute;top:2px;right:3px;color:#fff;background:rgba(0,0,0,0.6);border-radius:3px;padding:0 4px;font-size:10px;cursor:pointer">✕</span>
        </div>
      `).join('');
    }

    function addSamplePhoto(tag) {
      modalPhotos.push({
        tag,
        url: svgPhoto(tag === 'OK' ? 'OK_R' : 'CRACK'),
        cap: tag === 'OK' ? '改进防错标准截面' : '失效部位显微实拍'
      });
      renderModalPhotos();
    }

    function uploadPhotoToModal() {
      uploadCb = (url, fname) => {
        modalPhotos.push({ tag: 'NG', url, cap: fname.slice(0, 18) });
        renderModalPhotos();
      };
      document.getElementById('imgPicker').click();
    }

    function saveCardModal() {
      const mode = document.getElementById('cmMode').value.trim();
      if (!mode) { toast('请填写失效模式'); return; }
      const ctx = getActiveContext();
      if (!ctx) return;

      let s = null, o = null, d = null;
      const sodStr = document.getElementById('cmSod').value.trim();
      if (/^\d+\s*,\s*\d+\s*,\s*\d+$/.test(sodStr)) {
        [s, o, d] = sodStr.split(',').map(v => Math.min(10, Math.max(1, parseInt(v.trim(), 10))));
      }
      const refs = document.getElementById('cmRefs').value.split(/[,，]/).map(parseRef).filter(Boolean);

      snapshotBeforeMutate();
      const payload = {
        id: editingCardId || ('fm-' + Date.now()),
        cat: document.getElementById('cmCat').value,
        risk: document.getElementById('cmRisk').value,
        s, o, d,
        mode,
        mech: document.getElementById('cmMech').value.trim(),
        effect: document.getElementById('cmEffect').value.trim(),
        ctrl: document.getElementById('cmCtrl').value.trim(),
        photos: modalPhotos,
        refs
      };

      if (editingCardId) {
        const hit = findFmea(editingCardId);
        if (hit) Object.assign(hit.f, payload);
      } else {
        ctx.fmeas.unshift(payload);
      }
      persistOnly();
      closeCardModal();
      renderAll();
      toast('已保存失效卡片');
    }

    function deleteFmeaCard(fid) {
      const hit = findFmea(fid);
      if (!hit) return;
      snapshotBeforeMutate();
      const idx = hit.list.findIndex(x => x.id === fid);
      if (idx >= 0) hit.list.splice(idx, 1);
      persistOnly();
      renderAll();
      toast('已移除卡片（Ctrl+Z 可撤销）');
    }

    // ================= 10. 图鉴墙、同源台账、空间一键定位、AI 录入 =================
    function allFlattened() {
      const kw = document.getElementById('kwInput').value.trim().toLowerCase();
      const arr = [];
      Object.values(db).forEach(b => {
        b.boards.forEach(bp => bp.pins.forEach(p => p.fmeas.forEach(f =>
          arr.push({ f, boardKey: b.id, boardName: b.name, kind: 'pin', id: p.id, bpId: bp.id, ownerName: p.title, kindTxt: '底图热点' })
        )));
        b.nodes.forEach(nd => nd.fmeas.forEach(f =>
          arr.push({ f, boardKey: b.id, boardName: b.name, kind: 'node', id: nd.id, ownerName: nd.title, kindTxt: '模块节点' })
        ));
        b.edges.forEach(ed => ed.fmeas.forEach(f =>
          arr.push({ f, boardKey: b.id, boardName: b.name, kind: 'edge', id: ed.id, ownerName: ed.label, kindTxt: '连线接口' })
        ));
      });
      return arr.filter(it => {
        if (highOnly && it.f.risk !== 'HIGH') return false;
        if (kw && !JSON.stringify(it).toLowerCase().includes(kw)) return false;
        return true;
      });
    }

    function renderGalleryAndLedger() {
      const list = allFlattened();
      document.getElementById('galGrid').innerHTML = list.map(it =>
        renderCardItemHtml(it.f, { boardKey: it.boardKey, kind: it.kind, id: it.id, bpId: it.bpId })
      ).join('') || `<div style="color:var(--ink-4)">无匹配记录</div>`;

      document.getElementById('ledgerBody').innerHTML = list.map(it => {
        const { f } = it;
        const img = f.photos && f.photos[0]
          ? `<img src="${f.photos[0].url}" style="width:46px;height:30px;object-fit:cover;border-radius:4px;cursor:zoom-in;border:1px solid var(--line)" onclick="openLightbox('${f.photos[0].url}','${escAttr(f.mode)}')" />`
          : `<span style="color:var(--ink-4);font-size:11px">-</span>`;
        const codes = (f.refs || []).map(r => `<span class="s-chip ${r.type === 'free' ? 'free' : ''}" style="margin-right:3px">${esc(r.code || r.label)}</span>`).join('');
        return `<tr>
          <td style="font-size:11.5px;color:var(--ink-3)">${it.kindTxt}</td>
          <td><b>${esc(it.ownerName)}</b></td>
          <td>${img}</td>
          <td><b>${esc(f.mode)}</b><div style="font-size:11.5px;color:var(--ink-3)">${esc(f.effect || '')}</div></td>
          <td><div>${esc(f.mech || '-')}</div><div style="font-size:11.5px;color:var(--low)">${esc(f.ctrl || '')}</div></td>
          <td><span class="r-pill ${f.risk}"><span class="dot ${f.risk}"></span>${riskText(f.risk)}</span></td>
          <td>${codes}</td>
          <td style="text-align:center"><button class="link-act" style="color:var(--accent);font-weight:600" onclick="locateOnCanvas('${it.boardKey}','${it.kind}','${it.id}','${it.bpId || ''}')">定位</button></td>
        </tr>`;
      }).join('');
    }

    function locateOnCanvas(boardKey, kind, id, bpId) {
      curBoardId = boardKey;
      switchView('canvas');
      resetView();
      selectObj(kind, id, bpId || undefined);
    }

    function openAiModal() {
      fillAiDemo(1);
      document.getElementById('aiModal').classList.add('open');
    }
    function closeAiModal() { document.getElementById('aiModal').classList.remove('open'); }
    function fillAiDemo(n) {
      document.getElementById('aiText').value = n === 1
        ? `售后通报：步科电气(SUP-015)送样的无框电机定子(PRT-205)在110℃连续冲击下，定子铁芯与铝壳过盈配合面打滑转圈。机理：铝壳热膨胀系数约为硅钢片2倍，高温过盈量归零。对策：增加轴向止转销+固持胶648。关联预研件：三代髋关节模组。`
        : `总装异常：谐波柔轮(PRT-102)与无框电机定子(PRT-205)同轴合装时，波发生器轴向窜动顶死转子端面异响。机理：波形弹簧垫圈压缩裕度不足。对策：增加台阶硬限位+压装位移监控。`;
    }

    function runAiImport() {
      const txt = document.getElementById('aiText').value.trim();
      if (!txt) return;
      snapshotBeforeMutate();
      curBoardId = 'actuator';
      const b = B();

      if (txt.includes('同轴合装')) {
        let ed = b.edges.find(x => (x.from === 'nd-flex' && x.to === 'nd-stator') || (x.from === 'nd-stator' && x.to === 'nd-flex'));
        if (!ed) {
          ed = { id: 'ed-' + Date.now(), from: 'nd-stator', to: 'nd-flex', label: '轴向窜动', sub: '波发生器 ➔ 转子端面配合接口', fmeas: [] };
          b.edges.push(ed);
        }
        ed.fmeas.unshift({
          id: 'fm-' + Date.now(), cat: 'DFMEA', risk: 'HIGH', s: 8, o: 3, d: 4,
          mode: '波发生器轴向窜动顶死电机转子端面卡滞',
          mech: '轴向波形弹簧垫圈压缩裕度不足或漏装防错缺失',
          effect: '正反转卡顿异响、峰值电流报警',
          ctrl: '台阶轴硬限位 + 压装位移传感器在线监控垫圈在位',
          photos: [{ tag: 'NG', url: svgPhoto('CRACK'), cap: '转子端面环形磨痕实拍' }],
          refs: [MASTER_DICT['PRT-102'], MASTER_DICT['PRT-205']].map(m => ({ type: m.type, code: m.code, label: m.name }))
        });
        persistOnly();
        closeAiModal();
        switchView('canvas');
        selectObj('edge', ed.id);
        toast('AI 已生成「轴向窜动」接口连线并挂载失效卡片');
      } else {
        const nd = b.nodes.find(x => x.id === 'nd-stator') || b.nodes[0];
        nd.fmeas.unshift({
          id: 'fm-' + Date.now(), cat: '教训', risk: 'HIGH', s: 9, o: 3, d: 4,
          mode: '110℃高温冲击下定子铁芯与铝壳过盈丧失打滑',
          mech: '铝壳热膨胀系数为硅钢片 2 倍，高温下冷态 0.04mm 过盈量归零',
          effect: '相位角突变失步或扯断引线',
          ctrl: '轴向骑缝止转销 + 耐高温圆柱固持胶 648 双重防错',
          photos: [{ tag: 'NG', url: svgPhoto('WIRE'), cap: '定子外圆打滑拉伤实拍' }],
          refs: [
            { type: 'part', code: 'PRT-205', label: '无框力矩电机定子' },
            { type: 'supplier', code: 'SUP-015', label: '步科电气' },
            { type: 'free', code: null, label: '三代髋关节模组' }
          ]
        });
        persistOnly();
        closeAiModal();
        switchView('canvas');
        selectObj('node', nd.id);
        toast('AI 已自动归入「无框电机定子」节点');
      }
      renderAll();
    }

    // ================= 11. 全局快捷键、Ctrl+V 贴图、拖拽图片入画布、导入导出 =================
    window.addEventListener('keydown', (e) => {
      if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) return;
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
      else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); }
      else if ((e.key === 'Delete' || e.key === 'Backspace') && sel) { e.preventDefault(); deleteActiveSelection(); }
      else if (e.key === 'Escape') { clearSelection(); closeCardModal(); closeAiModal(); }
    });

    window.addEventListener('paste', (e) => {
      const items = (e.clipboardData && e.clipboardData.items) || [];
      for (const it of items) {
        if (it.type.indexOf('image') !== -1) {
          const r = new FileReader();
          r.onload = (ev) => {
            if (document.getElementById('cardModal').classList.contains('open')) {
              modalPhotos.push({ tag: 'NG', url: ev.target.result, cap: '剪贴板截图' });
              renderModalPhotos();
              toast('已贴入失效照片');
            } else {
              addBoardImage(ev.target.result, '剪贴板底图');
            }
          };
          r.readAsDataURL(it.getAsFile());
          e.preventDefault();
          return;
        }
      }
    });

    stageEl.addEventListener('dragover', (e) => { e.preventDefault(); stageEl.classList.add('drop-ready'); });
    stageEl.addEventListener('dragleave', () => stageEl.classList.remove('drop-ready'));
    stageEl.addEventListener('drop', (e) => {
      e.preventDefault();
      stageEl.classList.remove('drop-ready');
      const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) {
        const r = new FileReader();
        r.onload = (ev) => addBoardImage(ev.target.result, file.name.replace(/\.[^.]+$/, '').slice(0, 12));
        r.readAsDataURL(file);
      }
    });

    document.getElementById('imgPicker').addEventListener('change', function () {
      const f = this.files && this.files[0];
      if (!f || !uploadCb) return;
      const r = new FileReader();
      r.onload = (ev) => uploadCb(ev.target.result, f.name);
      r.readAsDataURL(f);
      this.value = '';
    });

    document.getElementById('jsonPicker').addEventListener('change', function () {
      const f = this.files && this.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = (ev) => {
        try {
          const parsed = JSON.parse(ev.target.result);
          if (parsed && typeof parsed === 'object') {
            snapshotBeforeMutate();
            db = parsed;
            curBoardId = Object.keys(db)[0];
            sel = null;
            persistOnly();
            renderAll();
            toast('已导入画板数据');
          }
        } catch (_) { toast('JSON 格式无效'); }
      };
      r.readAsText(f);
      this.value = '';
    });

    function exportJson() {
      closePops();
      const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'sqm_fmea_boards.json';
      a.click();
      toast('已导出 JSON 备份');
    }

    function resetFactory() {
      closePops();
      snapshotBeforeMutate();
      db = buildFactoryData();
      curBoardId = 'actuator';
      sel = { kind: 'pin', id: 'pin-1', boardId: 'bp-1' };
      resetView();
      persistOnly();
      renderAll();
      toast('已恢复初始示例数据');
    }

    function openNewBoardModal() {
      document.getElementById('newBoardName').value = '';
      document.getElementById('boardModal').classList.add('open');
      setTimeout(() => document.getElementById('newBoardName').focus(), 40);
    }

    function confirmNewBoard() {
      const name = document.getElementById('newBoardName').value.trim();
      const group = document.getElementById('newBoardGroup').value.trim() || '未分组系统';
      if (!name) return;
      snapshotBeforeMutate();
      const id = 'bd-' + Date.now();
      db[id] = {
        id, group, name,
        boards: [],
        nodes: [{ id: 'nd-' + Date.now(), title: '核心模块 1', sub: '点击修改短码', x: 140, y: 140, fmeas: [] }],
        edges: []
      };
      curBoardId = id;
      sel = null;
      persistOnly();
      document.getElementById('boardModal').classList.remove('open');
      renderAll();
      toast(`已创建画板「${name}」`);
    }

    function onSwitchBoard(id) {
      curBoardId = id;
      sel = null;
      resetView();
      renderAll();
    }

    function switchView(v) {
      curView = v;
      document.getElementById('tabCanvas').classList.toggle('active', v === 'canvas');
      document.getElementById('tabGallery').classList.toggle('active', v === 'gallery');
      document.getElementById('tabLedger').classList.toggle('active', v === 'ledger');
      document.getElementById('stageCanvas').style.display = v === 'canvas' ? 'block' : 'none';
      document.getElementById('stageGallery').classList.toggle('active', v === 'gallery');
      document.getElementById('stageLedger').classList.toggle('active', v === 'ledger');
      renderAll();
    }

    function toggleHighFilter() {
      highOnly = !highOnly;
      document.getElementById('btnHighOnly').classList.toggle('active-filter', highOnly);
      renderAll();
    }

    function toggleMoreMenu(ev) {
      ev.stopPropagation();
      document.getElementById('moreMenu').classList.toggle('open');
    }

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.pop-mini') && !e.target.closest('.more-wrap')) closePops();
    });

    function openLightbox(url, cap) {
      document.getElementById('lbImg').src = url;
      document.getElementById('lbCap').textContent = cap || '';
      document.getElementById('lightbox').classList.add('open');
    }

    function toast(msg) {
      const box = document.getElementById('toastLayer');
      const el = document.createElement('div');
      el.className = 'toast-pill';
      el.textContent = msg;
      box.appendChild(el);
      setTimeout(() => el.remove(), 2200);
    }

    function esc(s) {
      return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function escAttr(s) { return esc(s).replace(/'/g, '&#39;'); }

    function renderAll() {
      renderModuleNav();
      renderCanvas();
      renderGalleryAndLedger();
      syncUndoBtns();
    }

    // 首次启动按屏幕可用宽度自适应缩放，确保左右面板展开时全图完整居中无遮挡
    (function fitInitialStage() {
      const availW = stageEl.clientWidth - (sel ? 396 : 32);
      if (availW > 300 && availW < 1120) {
        zoom = Math.max(0.68, +(availW / 1140).toFixed(2));
        panX = 18;
        panY = 36;
      }
      renderAll();
    })();
  </script>
</body>
</html>
